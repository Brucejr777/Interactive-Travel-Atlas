<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Interactive Travel Atlas — explore countries, cultures, landmarks, foods, and the people who shaped them."
    />
    <meta name="theme-color" content="#6d28d9" />
    <title>Interactive Travel Atlas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!--
      Apply the persisted theme before first paint so the page never flashes
      the wrong colour scheme. The Zustand persist format is
      { state: {...}, version: n } under the key `atlas:user:v1`.
    -->
    <script>
      ;(function () {
        try {
          var raw = window.localStorage.getItem('atlas:user:v1')
          if (!raw) return
          var parsed = JSON.parse(raw)
          var theme = parsed && parsed.state && parsed.state.theme
          if (theme === 'dark' || theme === 'light') {
            document.documentElement.setAttribute('data-theme', theme)
          }
        } catch (err) {
          /* ignore — fall back to system preference */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
